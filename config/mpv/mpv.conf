
# =========================
# Decode & Performance
# =========================
hwdec=auto-safe
profile=fast

# =========================
# General & UI
# =========================
keep-open=yes
save-position-on-quit=yes
autofit=70%
volume-max=200
osc=no
osd-bar=no


# In dwm, 'border=no' prevents mpv from drawing its own title bar.
# dwm will still draw its own border around the window based on your dwm theme.
border=no

# =========================
# X11 & Startup (The Big Change)
# =========================
vo=gpu-next
# Changed from wayland to x11egl (preferred) or x11
gpu-context=x11egl
gpu-api=opengl

