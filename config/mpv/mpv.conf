
# =========================
# Decode & Performance
# =========================
hwdec=auto-safe
profile=fast

# =========================
# General & UI
# =========================
keep-open=yes
idle=yes
force-window=immediate
save-position-on-quit=yes
autofit=70%
volume-max=200
osc=no
osd-bar=no


# In dwm, 'border=no' prevents mpv from drawing its own title bar.
# dwm will still draw its own border around the window based on your dwm theme.
border=no

# =========================
# X11 & Startup (The Big Change)
# =========================
vo=gpu-next,gpu,x11
# Keep the same GPU renderer on real hardware, with GLX/software fallback in VMs.
gpu-context=auto
gpu-api=opengl

