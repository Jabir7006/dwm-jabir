; Match Fontconfig to the bar DPI so pixelsize stays the intended size.
font-0 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=14:dpi=96;3"
font-1 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=14:dpi=96;3"
font-2 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=14:dpi=96;3"
font-3 = "JetBrainsMono Nerd Font:style=Italic:pixelsize=14:dpi=96;3"
font-4 = "JetBrainsMono Nerd Font:style=Italic:pixelsize=14:dpi=96;3"
font-5 = "JetBrainsMono Nerd Font:pixelsize=15:dpi=96;3"

font-6 = "Feather:pixelsize=15:dpi=96;3"

font-7 = "Material Icons:pixelsize=15:dpi=96;3"
font-8 = "Material Icons Outlined:pixelsize=15:dpi=96;3"
font-9 = "Material Icons Round:pixelsize=15:dpi=96;3"
font-10 = "Material Icons Sharp:pixelsize=15:dpi=96;3"
font-11 = "Material Icons TwoTone:pixelsize=15:dpi=96;3"
font-12 = "Noto Color Emoji:pixelsize=15:dpi=96;1"

; Badge font for the active-tag floating circle (index 13 → %{T14}).
; Uses DejaVu Sans, which carries the negative-circled digits ❶..❾ (U+2776..277E).
; The glyph is a filled disc with the number reversed out, so it floats centered
; in the bar. Iterate size/offset here: bigger = larger disc, 2nd number = offset.
font-13 = "DejaVu Sans:size=21:dpi=96;3"

; Workspace numbers use the same 14px size and alignment as clock/percentages (index 15).
font-14 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=14:dpi=96;3"

; Optically matched tall icons: 13px font renders about 12px ink (index 16).
font-15 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=13:dpi=96;3"

; Wide keyboard glyph is balanced by area against the other icons (index 17).
font-16 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=17:dpi=96;4"

; Filled workspace mark matches the 14px text scale and alignment (index 18).
font-17 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=14:dpi=96;3"

; Bell curve and slim separators use their own optical scale (indices 19 and 20).
font-18 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=14:dpi=96;3"
font-19 = "JetBrainsMono Nerd Font:style=Regular:pixelsize=12:dpi=96;3"
