;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar

include-file = $HOME/.config/polybar/themes/minimal/include-modules.ini

[bar/main]
dpi = 96
monitor = ${env:MONITOR:}
width = 100%
; 27px content + the retained 1px bottom border = 28px total height.
height = 27
padding-left = 1
padding-right = 1
offset-y = 0
bottom = false
fixed-center = true

; wm-restack = bspwm
; wm-restack = i3

override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

; Underline/overline thickness (used by the active dwm-tag accent underline)
line-size = 3pt

background = ${colors.bg}
foreground = ${colors.fg}

; Center stays compact; right-side dividers are placed explicitly below.
separator =
separator-foreground = ${colors.fg-alt}

include-file = $HOME/.config/polybar/fonts.ini

modules-left = dwm-tags
modules-center = date-center reminder-center
modules-right = pulseaudio right-divider warp right-divider sink-toggle right-divider osk right-divider brightnessctl right-divider battery right-divider tray right-divider powermenu

cursor-click = pointer
cursor-scroll = ns-resize

border-bottom-size = 1
border-bottom-color = ${colors.soft}

[bar/secondary]
dpi = 96
monitor = ${env:MONITOR:}
width = 100%
height = 28
offset-y = 0
bottom = false
fixed-center = true

; wm-restack = bspwm
; wm-restack = i3

override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = false

; Underline/overline thickness (used by the active dwm-tag accent underline)
line-size = 3pt

background = ${colors.bg}
foreground = ${colors.fg}

; Module separator settings
separator = |
separator-foreground = ${colors.fg-alt}

include-file = $HOME/.config/polybar/fonts.ini

; Secondary bar modules (with dwm-tags to show all tags, but no systray)
modules-left = dwm-tags
modules-center = title
modules-right = pulseaudio reminder date

cursor-click = pointer
cursor-scroll = ns-resize

[settings]
screenchange-reload = true
