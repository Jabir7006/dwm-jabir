[module/battery]
type = internal/battery
battery = ${env:DWM_BATTERY:BAT0}
adapter = ${env:DWM_ADAPTER:AC}

# আপনার ব্যাটারি ৯৬% এ হোল্ড করে, তাই ফুল-এট ৯৫ দিলে এটি প্লাগ আইকন দেখাবে
full-at = 95

# লো-এন্ড পিসির অপটিমাইজেশনের জন্য প্রতি ৩০ সেকেন্ড পর পর রিড করবে
poll-interval = 30

# ১. চার্জিং স্টেট (প্লাগ আইকন)
format-charging = <label-charging>
format-charging-padding = 1
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.fg}
label-charging = %percentage%%

# ২. ডিসচার্জিং স্টেট (ব্যাটারি আইকন - যখন চার্জার খোলা থাকবে)
format-discharging = <label-discharging>
format-discharging-padding = 1
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.fg}
label-discharging = %percentage%%

# ৩. ফুল বা হোল্ড স্টেট (প্লাগ আইকন - ৯৫% এর উপরে গেলেই এটি অ্যাক্টিভ হবে)
format-full = <label-full>
format-full-padding = 1
format-full-prefix = " "
format-full-prefix-foreground = ${colors.fg}
label-full = %percentage%%
