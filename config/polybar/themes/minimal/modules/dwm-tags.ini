[module/dwm-tags]
type = custom/script
exec = $HOME/.config/polybar/scripts/dwm-tags.sh --tail
tail = true

; Format
format = <label>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 1

label = %output%

; Color customization (pass as environment variables)
; Active tag color (currently selected) — legacy digit color / fallback
env-DWM_TAG_ACTIVE_COLOR = #E6D9DB
; Active tag pill background (accent) and digit color (bar background)
env-DWM_TAG_ACTIVE_BG = #F38D70
env-DWM_TAG_ACTIVE_FG = #2C2525
; Occupied tag color (has windows)
env-DWM_TAG_OCCUPIED_COLOR = #C3B7B8
; Urgent tag color (urgent hint set)
env-DWM_TAG_URGENT_COLOR = #FD6883

; Font customization: (check fonts.ini for available fonts)
; Font index for active tags
env-DWM_TAG_ACTIVE_FONT = 3
; Font index for occupied tags
env-DWM_TAG_OCCUPIED_FONT = 3
; Font index for urgent tags
env-DWM_TAG_URGENT_FONT = 3
; Font index for the active-tag disc glyph (see fonts.ini font-13)
env-DWM_TAG_BADGE_FONT = 14

; Features:
; - Active tags: Shows currently selected tag (bright)
; - Occupied tags: Shows tags with windows (dimmer)
; - Urgent tags: Shows tags with urgent windows (red)
; - Empty tags: Hidden automatically
; - Works across all monitors
