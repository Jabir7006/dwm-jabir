[module/dwm-tags]
type = custom/script
exec = $HOME/.config/polybar/scripts/dwm-tags.sh --tail
tail = true

; Format
format = <label>
format-foreground = ${colors.fg}
format-background = ${colors.bg}
format-padding = 0

label = %output%

; Use the live palette for Omarchy's neutral foreground.
env-DWM_TAG_FOREGROUND = ${colors.fg}
env-DWM_TAG_PERSISTENT_COUNT = 5

; Legacy theme color fallbacks (maintained by theme-apply.sh)
; Active workspace foreground fallback
env-DWM_TAG_ACTIVE_COLOR = #E6D9DB
; Legacy accent values kept compatible with theme-apply.sh
env-DWM_TAG_ACTIVE_BG = #F38D70
env-DWM_TAG_ACTIVE_FG = #2C2525
; Occupied tag color (has windows)
env-DWM_TAG_OCCUPIED_COLOR = #C3B7B8
; Urgent tag color (urgent hint set)
env-DWM_TAG_URGENT_COLOR = #FD6883

; Font customization: (check fonts.ini for available fonts)
; Font index for active tags
env-DWM_TAG_ACTIVE_FONT = 18
; Font index for occupied tags
env-DWM_TAG_OCCUPIED_FONT = 15
; Font index for urgent tags
env-DWM_TAG_URGENT_FONT = 15

; Features:
; - Active workspace: Omarchy rounded-square glyph
; - Occupied workspace: small regular number
; - Urgent tags: Shows tags with urgent windows (red)
; - Workspaces 1-5 stay visible; empty slots use 50% opacity
; - Higher tags appear when active, occupied or urgent
; - Works across all monitors
