[module/updates]
type = custom/script
exec = /home/jabir/.config/polybar/themes/minimal/updates.sh
interval = 3600
format = <label>
label = %output%
label-padding = 1

# Left click: Alacritty ওপেন করে yay -Syu রান করবে
click-left = alacritty -e yay -Syu &

# Right click: Official এবং AUR আপডেটের হিসাব নোটিফিকেশন আকারে দেখাবে
click-right = /home/jabir/.config/polybar/themes/minimal/updates.sh --notify &
