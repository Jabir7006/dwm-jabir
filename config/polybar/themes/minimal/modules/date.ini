[module/date]
type = internal/date
interval = 1

time = "%I:%M %p"
time-alt = "%a, %b %d %H:%M:%S"

label = %{T2}%time%%{T-}
label-padding = 4px

; Compact center presentation; other uses keep their existing spacing.
[module/date-center]
inherit = module/date
label-padding = 0
label-padding-left = 4px
