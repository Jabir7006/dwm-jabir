[module/reminder]
type = custom/script
exec = $HOME/.config/polybar/themes/minimal/reminder.sh status
interval = 30
format = <label>
label = %output%
label-padding = 1

# Left click: ask for a duration, then an optional message.
click-left = $HOME/.config/polybar/themes/minimal/reminder.sh add &

# Right click: list / cancel existing reminders.
click-right = $HOME/.config/polybar/themes/minimal/reminder.sh manage &

; Same reminder actions and interval, with the compact center presentation.
[module/reminder-center]
inherit = module/reminder
exec = $HOME/.config/polybar/themes/minimal/reminder.sh status --compact
label-padding = 0
label-margin-left = 8px
; Nerd Font icons extend past their advance width; reserve room for the bell.
label-padding-right = 6px

; Static right-side decoration; no script, polling or background process.
[module/right-divider]
type = custom/text
label = |
label-foreground = ${colors.fg-alt}
label-font = 20
