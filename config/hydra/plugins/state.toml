[plugins.manifest]
id = "hydra.torrent"
name = "Torrent Downloader"
author = "Hydra Team"
version = "0.1.0"
api = 1
min_hydra = "1.0.7"
license = "MIT OR Apache-2.0"
welcome = "Add a magnet link or browse for a torrent file. This plugin imports libtorrent through its packaged native library. Native code runs with Hydra's operating-system permissions. Transfers upload pieces to peers while downloading. Seeding after download stops immediately by default; change Seeding time to keep sharing. Single-file torrents save as a file; multi-file torrents save the selected files in a folder."
module = "plugin.wasm"
memory_mb = 128
publisher_key = "RWTaGOCLthz+jwx/MfJUHw9YUABimWtJvF0ZwDVlRgfspb7sD7iy+x8x"
hooks = [
    "resolve",
    "check",
]
claims = [
    "magnet:*",
    "*://*/*.torrent",
    "*://*/*.torrent?*",
]

[[plugins.manifest.input_actions]]
label = "Browse Torrent File"
extensions = ["torrent"]

[[plugins.manifest.native_modules]]
id = "torrent-engine"
platform = "linux-x86_64"
module = "torrent-linux-x86_64.so"

[plugins.manifest.permissions]
http = ["*"]
sources = []
cookies = []
data = false
exec = []
native = ["torrent-engine"]
exec_from_data = false

[[plugins.manifest.settings]]
key = "seed_seconds"
label = "Seeding time after download (seconds)"
type = "number"
default = 0.0
help = "Uploads also happen during download. Zero stops sharing once the selected files are complete."
options = []

[[plugins.manifest.settings]]
key = "upload_limit"
label = "Upload limit (bytes per second)"
type = "number"
default = 0.0
help = "Zero means unlimited."
options = []

[plugins.signing.Verified]
fingerprint = "b567c8a9f94ea0a5"

[plugins.grants]
http = ["*"]
sources = []
cookies = []
data = false
exec = []
native = ["torrent-engine"]
exec_from_data = false

[plugins.pins]

[plugins.settings]
seed_seconds = 0.0
upload_limit = 0.0

[plugins.native_sha256]
"torrent-linux-x86_64.so" = "15b9a887378dc991e2fae856e32c28cf4de7ab63adac3879e202a7f063283dda"

