[plugins.manifest]
id = "hydra.youtube"
name = "YouTube Downloader"
author = "Hydra Team"
version = "0.1.0"
api = 1
license = "MIT OR Apache-2.0"
welcome = "Install yt-dlp on PATH, or enable 'Download yt-dlp if it is missing' in this plugin’s settings. Choose an installed JavaScript runtime (Node or Deno) when YouTube requires it. Install ffmpeg on PATH to combine video and audio or extract MP3 audio. Add a YouTube video or playlist URL, then choose quality, audio and subtitles before downloading."
module = "plugin.wasm"
memory_mb = 64
publisher_key = "RWTaGOCLthz+jwx/MfJUHw9YUABimWtJvF0ZwDVlRgfspb7sD7iy+x8x"
hooks = [
    "resolve",
    "refresh",
    "check",
]
claims = [
    "*://*.youtube.com/watch*",
    "*://youtube.com/watch*",
    "*://*.youtube.com/shorts/*",
    "*://youtube.com/shorts/*",
    "*://youtu.be/*",
    "*://*.youtube.com/playlist*",
    "*://youtube.com/playlist*",
]
input_actions = []
native_modules = []

[plugins.manifest.permissions]
http = [
    "github.com",
    "release-assets.githubusercontent.com",
    "objects.githubusercontent.com",
]
sources = [
    "*.googlevideo.com",
    "*.youtube.com",
    "youtube.com",
]
cookies = [
    "youtube.com",
    "*.youtube.com",
]
data = true
native = []
exec_from_data = true

