# ~/.config/starship.toml
#
# LAYOUT IS YOURS TO EDIT — COLOURS ARE GENERATED.
# theme-apply.sh rewrites only the block between the two "starship theme
# palette" markers at the bottom, using the active theme from
# ~/.config/dwm-titus/themes.toml. Add your own settings ABOVE that block.
#
# Palette names available to any style: bg, fg, muted, accent, red, green,
# yellow, blue, purple, cyan, and their bright_* variants, plus pill_fg
# (ink colour for solid-background segments).

add_newline = true
palette = "theme"

# সিঙ্গেল লাইন ফরম্যাট
format = "$character$directory$git_branch "

[character]
# স্ক্রিনশটের মতো সবুজ রঙের অ্যারো
success_symbol = "[➜](bold bright_green) "
error_symbol = "[➜](bold bright_red) "

[directory]
# ফোল্ডারের নাম পার্পল/ম্যাজেন্টা কালারে
format = "[$path]($style) "
style = "bold purple"
truncation_length = 3
truncate_to_repo = true

[git_branch]
# সলিড ব্যাকগ্রাউন্ড এবং থিম-টেক্সট (GitHub ও Branch আইকনসহ)
format = "[ 󰊤 $symbol$branch ]($style)"
symbol = " "
style = "bg:bright_green fg:pill_fg bold"


# ══════════════════════════════════════════════════════════════════════════════
# >>> starship theme palette (generated by theme-apply.sh - do not edit) >>>
[palettes.theme]
bg            = "#2C2525"
fg            = "#E6D9DB"
muted         = "#72696A"
accent        = "#F38D70"
red           = "#FD6883"
green         = "#ADDA78"
yellow        = "#F9CC6C"
blue          = "#F38D70"
purple        = "#A8A9EB"
cyan          = "#85DACC"
bright_red    = "#FF8297"
bright_green  = "#C8E292"
bright_yellow = "#FCD675"
bright_blue   = "#F8A788"
bright_purple = "#BEBFFD"
bright_cyan   = "#9BF1E1"
pill_fg       = "#2C2525"
# <<< starship theme palette <<<
