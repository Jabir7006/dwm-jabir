# ~/.config/picom/picom.conf
# Performance-first picom for dwm / X11 on a low-end laptop.
# Look: rounded corners + subtle shadows + light fades.
# Deliberately OFF: blur and window animations — the two effects that actually
# cost CPU/GPU continuously. Everything here is either GPU-offloaded or only
# runs on a window event, so idle cost is ~0.

#################################
# Backend & sync  (the part that fixed your old heat problem)
#################################
backend = "glx";        # GPU-accelerated. The old xrender backend composites on
                        # the CPU every frame — the usual cause of hot laptop +
                        # 15-20% CPU on video. glx offloads that to the GPU.
vsync = true;           # stops tearing WITHOUT a CPU busy-loop
use-damage = true;      # only repaint the screen regions that changed — big saver

# When any window goes fullscreen (fullscreen YouTube, video, games), picom stops
# compositing it entirely and lets it draw straight to the screen. Fullscreen
# playback then costs ZERO extra CPU. This is the single most important perf flag.
unredir-if-possible = true;

#################################
# Rounded corners  (cheap on glx — static, not per-frame)
#################################
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",   # full-width bar — leave its corners square
    "class_g = 'Dunst'",     # dunst already rounds itself
    "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'"
];
detect-rounded-corners = true;

#################################
# Shadows  (rendered once per window, not per frame)
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@"   # GTK CSD apps carry their own shadow — avoid doubling
];

#################################
# Fading  (only runs on open / close / focus — idle cost = 0)
#################################
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
# Window move/open ANIMATIONS (the expensive kind) are intentionally left off.

#################################
# Detection / correctness  (negligible cost)
#################################
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# No transparency during this test, on purpose — so if anything feels heavy we
# know it's corners+shadows, not opacity. We can add tasteful transparency later.

wintypes:
{
    tooltip       = { shadow = false; };
    dock          = { shadow = false; };
    dnd           = { shadow = false; };
    popup_menu    = { shadow = false; };
    dropdown_menu = { shadow = false; };
};
