# ~/.config/starship.toml

add_newline = true

# সিঙ্গেল লাইন ফরম্যাট
format = "$character$directory$git_branch "

[character]
# স্ক্রিনশটের মতো সবুজ রঙের অ্যারো 
success_symbol = "[➜](bold #50FA7B) "
error_symbol = "[➜](bold red) "

[directory]
# ফোল্ডারের নাম পার্পল/ম্যাজেন্টা কালারে
format = "[$path]($style) "
style = "bold #BD93F9"
truncation_length = 3
truncate_to_repo = true

[git_branch]
# সলিড সবুজ ব্যাকগ্রাউন্ড এবং কালো টেক্সট (GitHub ও Branch আইকনসহ)
format = "[ 󰊤 $symbol$branch ]($style)"
symbol = " "
style = "bg:#50FA7B fg:black bold"