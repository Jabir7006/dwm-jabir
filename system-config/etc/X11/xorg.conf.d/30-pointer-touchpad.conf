# General Mouse Settings
Section "InputClass"
    Identifier "system-mouse"
    MatchIsPointer "on"
    Driver "libinput"
    Option "LeftHanded" "on"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0.5"
EndSection

# Touchpad Specific Settings
Section "InputClass"
    Identifier "system-touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "LeftHanded" "off"
#    Option "AccelProfile" "adaptive"
#    Option "AccelSpeed" "0.5"
    Option "Tapping" "on"
    Option "NaturalScrolling" "on"
    Option "DisableWhileTyping" "on"
#    Option "ScrollPixelDistance" "15"
EndSection
